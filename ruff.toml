# Ruff configuration for the Python backend.

target-version = "py313"
line-length = 88

[lint]
# E4/E7/E9 + F are ruff's defaults; I (isort), UP (pyupgrade),
# B (bugbear) and PIE add useful checks. E501 is intentionally excluded
# (the French prompt strings are long).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PIE"]
ignore = [
    "B008", # FastAPI: Depends()/File() in argument defaults is intentional
]
